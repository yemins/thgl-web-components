name: THGL App - Build & Release

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'adfree'
        type: choice
        options:
          - adfree
          - standard

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Typecheck
        run: bun run typecheck
      
      - name: Build THGL App - ${{ inputs.variant }}
        run: |
          cd apps/thgl-app
          
          # Skip prerendering by creating .env.production.local
          cat > .env.production.local << 'EOF'
          NEXT_SKIP_ENV_VALIDATION=true
          NEXT_TELEMETRY_DISABLED=1
          EOF
          
          if [ "${{ inputs.variant }}" = "adfree" ]; then
            NEXT_PUBLIC_BUILD_VARIANT=adfree NEXT_PUBLIC_ADS_ENABLED=false bun run build -- --no-lint
          else
            NEXT_PUBLIC_BUILD_VARIANT=standard NEXT_PUBLIC_ADS_ENABLED=true bun run build -- --no-lint
          fi
        env:
          NODE_ENV: production
          NEXT_SKIP_ENV_VALIDATION: true
          SKIP_ENV_VALIDATION: true
          NEXT_TELEMETRY_DISABLED: 1
          # Skip problematic pages that require external APIs
          NEXT_PRIVATE_DISABLE_OPTIMIZED_FONT_LOADING: true
      
      - name: Check build output
        run: |
          ls -la apps/thgl-app/.next/ || echo "Build directory not found"
          du -sh apps/thgl-app/.next/ || echo "Could not calculate size"
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thgl-app-${{ inputs.variant }}-build-${{ github.run_number }}
          path: apps/thgl-app/.next/
          retention-days: 7
          if-no-files-found: warn
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thgl-app-${{ inputs.variant }}-${{ github.run_number }}
          name: "THGL App - ${{ inputs.variant }} (Build #${{ github.run_number }})"
          body: |
            # THGL Companion App - ${{ inputs.variant }} Variant
            
            **Build Number:** ${{ github.run_number }}
            **Variant:** ${{ inputs.variant }}
            **Status:** ✅ Build Successful
            
            ## Features
            ${{ inputs.variant == 'adfree' && '✅ No Advertisements
            ✅ Ad-Free Experience
            ✅ Equivalent to Patreon Version
            ✅ All Features Included' || '📺 Full NitroPay Ad Integration
            💰 Monetized Build
            🎮 Standard Public Release
            📊 Ad Revenue Enabled' }}
            
            ## Build Details
            - **Framework:** Next.js 15
            - **Runtime:** Bun
            - **Build Variant:** `${{ inputs.variant }}`
            - **Ads Enabled:** `${{ inputs.variant == 'standard' }}`
            - **Output:** Next.js compiled build (`.next/` directory)
            
            ## Download & Extract
            1. Download the artifact from the workflow run
            2. Extract the `.zip` file
            3. You'll have the complete `.next/` directory
            4. Use with your build system to create the final EXE
            
            ## Next Steps
            - 🧪 Test the build locally
            - 📦 Package into EXE using your preferred tool
            - 🚀 Deploy to users
            
            ---
            
            **Built with:** GitHub Actions + Bun + Next.js
            **Support:** [Discord](https://th.gl/discord) | [Patreon](https://www.th.gl/support-me)
          draft: false
          prerelease: ${{ inputs.variant != 'standard' }}
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
